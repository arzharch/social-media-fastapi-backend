name: Build and Deploy Code

on: 
  push:
    branches: 
      - "main"

  merge_request:
    branches: 
      - "main"


jobs:
  job1:

    runs-on: ubuntu-latest

    steps:
      - name: Pull git repo
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.10
          
        run: 
          python -m pip install --upgrade pip
          pip install -r requirements.txt